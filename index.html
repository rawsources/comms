<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Did You Catch That?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300..800&family=Newsreader:opsz,wght@6..72,400..600&display=swap" rel="stylesheet">
<style>
:root{
  /* One ordinary day, played back like a quiet stage. Gold = attention, ember = noise and harm, glacier = screens and cold logic. */
  --ink:#17151c;
  --ink-2:#221f29;
  --paper:#efe9df;
  --mute:#a8a2b3;
  --ember:#ff7a59;
  --glacier:#7cb8ff;
  --gold:#e8c37a;
  --line:rgba(239,233,223,.16);
  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --voice:"Newsreader",Georgia,"Times New Roman",serif;
  --body:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
#app{position:fixed;left:0;top:0;transform-origin:0 0;overflow:hidden;container-type:inline-size;container-name:app}
body{background:var(--ink);color:var(--paper);font-family:var(--body);font-size:17px;line-height:1.5;overflow:hidden;-webkit-font-smoothing:antialiased}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}

#glow{position:fixed;left:0;top:0;width:760px;height:760px;margin:-380px 0 0 -380px;border-radius:50%;
  background:radial-gradient(circle,rgba(240,222,186,.12) 0%,rgba(240,222,186,.045) 32%,transparent 62%);pointer-events:none;z-index:0;will-change:transform}
#grain{position:fixed;inset:0;pointer-events:none;z-index:60;opacity:.07;mix-blend-mode:overlay}

.scene{position:absolute;left:0;right:0;top:0;bottom:64px;display:flex;flex-direction:column;
  padding:clamp(18px,2.6cqw,36px) clamp(16px,5.5cqw,80px);overflow-y:auto;z-index:1;opacity:0;visibility:hidden;transition:opacity .8s,visibility .8s}
.scene.on{opacity:1;visibility:visible}
.wrap{width:100%;max-width:980px;margin:auto 0;display:flex;flex-direction:column;gap:18px}
.wrap.wide{max-width:1200px}
.label{display:flex;align-items:center;gap:12px;font-size:12px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--mute)}
.label::before{content:"";width:28px;height:1px;background:currentColor}

.voice p{font-family:var(--voice);font-weight:500;font-style:normal;font-size:clamp(26px,3.4cqw,44px);line-height:1.16;margin:0 0 .28em;max-width:30ch;text-wrap:pretty}
.voice.md p{font-size:clamp(22px,2.6cqw,34px);max-width:38ch}
.voice.sm p{font-size:clamp(20px,2cqw,26px);max-width:44ch;color:#d9d2c6}
.voice p.aside{color:var(--mute)}
.caret{display:inline-block;width:2px;height:.82em;background:var(--gold);margin-left:3px;vertical-align:-.06em;animation:blink 1.05s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.dots{display:inline-flex;gap:6px;vertical-align:middle}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--mute);animation:dot 1s infinite ease-in-out}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes dot{0%,100%{opacity:.25;transform:translateY(0)}50%{opacity:1;transform:translateY(-3px)}}

.reveal{opacity:0;transform:translateY(10px);transition:opacity .7s,transform .7s;pointer-events:none}
.reveal.in{opacity:1;transform:none;pointer-events:auto}
.btn{font-size:16px;font-weight:500;color:var(--paper);background:transparent;border:1px solid rgba(239,233,223,.32);padding:12px 22px;border-radius:999px;cursor:pointer;transition:border-color .2s,background .2s}
.btn:hover{border-color:var(--paper);background:rgba(239,233,223,.05)}
.btn.solid{background:var(--paper);color:var(--ink);border-color:var(--paper)}
.row{display:flex;flex-wrap:wrap;gap:14px;align-items:center}

/* intro */
h1.title{font-family:var(--display);font-weight:800;font-size:clamp(54px,10cqw,150px);line-height:.88;letter-spacing:-.045em;margin:0}
h1.title span{color:transparent;-webkit-text-stroke:1.5px rgba(239,233,223,.5)}
.kicker{font-size:14px;color:var(--mute);letter-spacing:.04em}
.dayline{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13px;color:var(--mute);font-variant-numeric:tabular-nums}
.dayline span b{color:var(--gold);font-weight:600;margin-right:6px}

/* moment layout */
.grid2{display:grid;grid-template-columns:1.12fr .88fr;gap:clamp(18px,3.2cqw,44px);align-items:start}
.stage{position:relative;border:1px solid var(--line);border-radius:18px;background:rgba(34,31,41,.6);padding:14px 20px 18px;min-height:320px;overflow:hidden;transition:box-shadow 1.2s}
.stage.blue{box-shadow:inset 0 0 90px rgba(124,184,255,.12)}
.stage-h{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--mute);letter-spacing:.1em;text-transform:uppercase;border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:16px}
.stage-h time{color:var(--gold);font-variant-numeric:tabular-nums;font-weight:700;margin-right:8px}
.hr{display:flex;align-items:center;gap:14px}
.db{display:flex;align-items:center;gap:8px}
.db i{width:84px;height:5px;border-radius:5px;background:rgba(239,233,223,.1);overflow:hidden;display:block}
.db i b{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold),var(--ember));transition:width .5s}
.replay{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);background:transparent;border:1px solid var(--line);border-radius:999px;padding:5px 12px;cursor:pointer}
.replay:hover{color:var(--paper);border-color:var(--paper)}
.lines{position:relative;z-index:1;display:flex;flex-direction:column;gap:10px}
.spot{position:absolute;left:0;right:0;height:150px;top:0;opacity:0;background:radial-gradient(55% 50% at 45% 50%,rgba(232,195,122,.2),transparent 72%);transition:top 1.5s cubic-bezier(.6,0,.2,1),opacity .8s;pointer-events:none;z-index:0}
.noise{position:absolute;inset:56px 0 0;pointer-events:none;z-index:2}
.ln{display:grid;grid-template-columns:118px 1fr;gap:14px;align-items:baseline;transition:opacity .9s,transform .9s,filter .9s}
.ln .who{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);font-weight:600;text-align:right;line-height:1.3}
.ln .tx{font-size:19px;line-height:1.35;transition:font-size .6s,opacity .6s}
.ln.th .tx{font-family:var(--voice);font-style:normal;color:var(--mute);font-size:20px}
.ln.dim{opacity:.3}
.ln.shoved{opacity:.3;transform:translateX(-12px);filter:blur(.5px)}
.tx.s1{font-size:21px}.tx.s2{font-size:26px;font-weight:600}.tx.s3{font-size:33px;font-weight:800;letter-spacing:-.01em;line-height:1.1}
.ln.quiet .tx{font-size:16px;opacity:.65}
.ln.quieter .tx{font-size:14px;opacity:.45}
.ln.phone .tx::before{content:"";display:inline-block;width:9px;height:14px;border-radius:2px;background:var(--glacier);margin-right:10px;box-shadow:0 0 14px 4px rgba(124,184,255,.45);vertical-align:-1px}
.tag{display:inline-block;margin-left:10px;font:600 10px/1 var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--ember);border:1px solid rgba(255,122,89,.5);border-radius:999px;padding:4px 8px;vertical-align:3px;font-style:normal}
.ln.ignored .tx{opacity:.5}
.sfx{position:absolute;font-family:var(--display);font-weight:800;color:var(--ember);opacity:0;transform:scale(.7) rotate(var(--r,0deg));transition:opacity .35s,transform .35s;white-space:nowrap;letter-spacing:-.01em}
.sfx.in{opacity:.82;transform:scale(1) rotate(var(--r,0deg))}
/* chat */
.stage.chat .lines{gap:8px}
.chat-h{display:flex;justify-content:space-between;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);margin-bottom:4px}
.bub{max-width:82%;padding:10px 14px;border-radius:16px;font-size:17px;line-height:1.38}
.bub.them{align-self:flex-start;background:rgba(255,122,89,.13);border:1px solid rgba(255,122,89,.32);border-bottom-left-radius:4px}
.bub.me{align-self:flex-end;background:rgba(124,184,255,.11);border:1px solid rgba(124,184,255,.32);border-bottom-right-radius:4px}
.meta{align-self:flex-end;font-size:12px;color:var(--mute);font-variant-numeric:tabular-nums}
.typ{align-self:flex-start;padding:12px 14px;border-radius:16px;background:rgba(255,122,89,.08)}
.note{align-self:center;font-family:var(--voice);font-style:normal;color:var(--mute);font-size:19px;margin-top:6px}

.side{display:flex;flex-direction:column;gap:12px}
.q{font-family:var(--display);font-weight:700;font-size:clamp(22px,2.2cqw,28px);letter-spacing:-.01em;margin-bottom:8px}
.opts{display:grid;gap:10px}
.opt{text-align:left;border:1px solid var(--line);background:transparent;color:var(--paper);padding:10px 14px;border-radius:12px;font-size:16px;cursor:pointer;transition:border-color .2s,background .2s,opacity .4s}
.opt:hover:not(:disabled){border-color:rgba(239,233,223,.45);background:rgba(239,233,223,.03)}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--gold);background:rgba(232,195,122,.09)}
.opt.wrong{border-color:rgba(255,122,89,.6)}
.opt.fade{opacity:.35}
.insight{display:grid;gap:10px;border-top:1px solid var(--line);padding-top:12px}
.insight h4{margin:0 0 4px;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute);font-weight:600}
.insight p{margin:0;font-size:16px;line-height:1.5}
.insight .lands{font-family:var(--voice);font-style:normal;font-size:21px;line-height:1.25}
.insight .try{border-left:3px solid var(--gold);padding-left:14px}
.insight .src{font-size:12px;color:var(--mute);margin-top:6px}
.insight .src:empty{display:none}
.bub .bn{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);margin-bottom:2px}
.bub.hot{background:rgba(255,122,89,.22);border-color:var(--ember);font-weight:600;animation:shake .45s 2}
.bub.cold{background:rgba(124,184,255,.18);border-color:var(--glacier)}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.acts{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.acts>div{border-top:1px solid var(--line);padding-top:12px;display:grid;gap:4px}
.acts b{font-family:var(--display);font-size:20px}
.acts span{font-size:14px;color:var(--mute)}
.acts small{font-size:12px;color:var(--gold);letter-spacing:.14em;text-transform:uppercase;font-weight:600}
.actrow{grid-column:1/-1;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute);margin-top:8px}
.tgrid{display:grid;grid-template-columns:1fr 1fr;gap:clamp(20px,4cqw,56px);align-items:start}
.tl{display:flex;flex-direction:column;gap:16px}
.t-origin{font-size:13px;color:var(--gold);letter-spacing:.12em;text-transform:uppercase;font-weight:600}
.t-name{font-family:var(--display);font-weight:800;font-size:clamp(44px,6.5cqw,92px);line-height:.92;letter-spacing:-.04em;margin:0}
.t-plain{font-size:clamp(18px,1.6cqw,21px);line-height:1.5;margin:0;max-width:46ch}
.t-src{font-size:12px;color:var(--mute);margin:0;max-width:60ch}
.tr{display:flex;flex-direction:column;gap:20px}
.widget{border:1px solid var(--line);border-radius:18px;background:rgba(34,31,41,.6);padding:20px;display:grid;gap:14px}
.wcap{margin:0;font-size:14px;color:var(--mute)}
.hab{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.hp{--o:1;border-radius:14px;background:rgba(23,21,28,.7);height:190px;position:relative;display:grid;place-items:center;overflow:hidden}
.hl{position:absolute;top:12px;left:14px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.hc{font-family:var(--display);font-weight:800;font-size:30px;color:var(--ember);opacity:var(--o);transition:opacity .6s}
.pulse{position:absolute;inset:0;display:grid;place-items:center;opacity:var(--o);transition:opacity .6s}
.pulse i{position:absolute;width:60px;height:60px;border-radius:50%;border:2px solid var(--ember);animation:ring 1.4s ease-out forwards}
@keyframes ring{from{transform:scale(.4);opacity:.9}to{transform:scale(2.6);opacity:0}}
.tt{border-radius:14px;background:rgba(23,21,28,.7);padding:16px 18px;min-height:96px}
.ttw{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.ttl{margin:6px 0 0;font-size:22px;line-height:1.3}
.ttr{display:grid;gap:8px;margin-top:16px}
.bar{position:relative;height:8px;border-radius:8px;background:rgba(239,233,223,.08)}
.bar .you{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:8px;background:var(--gold);transition:width .5s}
.bar .avg{position:absolute;top:-6px;bottom:-6px;width:2px;background:var(--glacier)}
.bar .avg::after{content:"200 ms";position:absolute;top:-18px;left:4px;font-size:11px;color:var(--glacier);white-space:nowrap;font-style:normal}
.ttm{margin:0;font-size:15px;min-height:1.5em}
.ttins{display:grid;gap:4px;font-size:15px;line-height:1.45;border-left:3px solid var(--gold);padding-left:14px}
.ttins b{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
.ttins em{font-style:normal;font-weight:600}
.ttl .missed{color:var(--mute);opacity:.6;text-decoration:line-through;text-decoration-color:rgba(255,122,89,.6)}
.btn:disabled{opacity:.35;cursor:default}
.lay{display:grid;gap:12px}
.lq{font-family:var(--voice);font-style:normal;font-size:30px;margin:0}
.lr{display:grid;gap:2px;border-left:3px solid var(--line);padding-left:14px;transition:opacity .6s,max-height .6s;max-height:120px}
.lr span{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.lr b{font-weight:500;font-size:18px}
#lf{border-left-color:var(--gold)}
.lr.hid{opacity:0;max-height:0;overflow:hidden}
.fm{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.fbar{height:10px;border-radius:10px;background:rgba(239,233,223,.08);overflow:hidden}
.fbar i{display:block;height:100%;width:70%;border-radius:10px;transition:width .5s,background .5s}
.facewrap{display:grid;gap:16px}
.fc .chip{min-width:0}
.lab{display:grid;gap:10px}
.lv{text-align:left;border:1px solid var(--line);background:transparent;color:var(--mute);border-radius:12px;padding:14px 16px;font-size:18px;cursor:pointer}
.lv small{display:block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;margin-bottom:4px}
.lv.on{color:var(--paper);border-color:var(--paper)}
.alarm{display:grid;gap:8px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.abar{height:10px;border-radius:10px;background:rgba(239,233,223,.08);overflow:hidden}
.abar i{display:block;height:100%;width:90%;transition:width .6s,background .6s}
.mt{display:grid;gap:10px}
.mr{display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:center;border-bottom:1px solid var(--line);padding-bottom:10px}
.mq{font-family:var(--voice);font-style:normal;font-size:20px}
.btn.sm{padding:6px 14px;font-size:14px}
.btn.picked{background:var(--paper);color:var(--ink)}
.mres{grid-column:1/-1;font-size:13px;min-height:1em}
.mres.ok{color:var(--gold)}.mres.no{color:var(--ember)}
@container app (max-width:960px){.tgrid{grid-template-columns:1fr}}
.widget .seg{justify-self:start}
.hf{display:grid;gap:8px}
.hfo,.hfm{display:grid;grid-template-columns:90px 1fr;gap:12px;align-items:baseline}
.hfo span,.hfm span{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);text-align:right}
.hfm b{font-weight:500;font-size:17px}
.hfo b{font-weight:400;font-size:16px;color:var(--glacier);filter:blur(6px);opacity:.5;transition:filter .5s,opacity .5s}
.widget.full .hfo b{filter:none;opacity:1}
.room{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
.seat{position:relative;height:74px;border-radius:12px;background:rgba(23,21,28,.7);display:grid;place-items:center;padding:6px}
.seat i{width:16px;height:16px;border-radius:50%;background:rgba(239,233,223,.25)}
.seat span{position:absolute;inset:6px;display:grid;place-items:center;text-align:center;font-family:var(--voice);font-style:normal;font-size:13px;line-height:1.15;opacity:0;transition:opacity .5s}
.seat.think i{opacity:.15}.seat.think span{opacity:1}
.seat.me{background:rgba(232,195,122,.18);outline:1px solid var(--gold)}
.seat.me span{font-family:var(--body);font-style:normal;font-weight:700;color:var(--gold);font-size:14px}
.bycount{margin:0;font-size:14px;color:var(--mute);font-variant-numeric:tabular-nums}
.byscript{margin:0;font-family:var(--voice);font-style:normal;font-size:22px;min-height:1.3em;color:var(--gold)}
.spot2{position:relative;display:flex;justify-content:space-between;padding:10px 18px;border-radius:999px;background:rgba(23,21,28,.7);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.sdot{position:absolute;top:50%;width:46px;height:46px;margin-top:-23px;border-radius:50%;background:radial-gradient(circle,rgba(232,195,122,.5),transparent 70%);transition:left .8s cubic-bezier(.6,0,.2,1)}
.sdot.them{left:6px}.sdot.you{left:calc(100% - 52px)}
.sr{margin:10px 0 0;font-size:16px;line-height:1.4}
.sr.bad{color:var(--ember)}.sr.good{color:var(--gold)}
.wk{display:grid;gap:8px;min-height:120px}
.wkl{display:grid;grid-template-columns:70px 1fr;gap:12px;align-items:baseline}
.wkl span{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);text-align:right}
.wkl b{font-weight:500}
.wkw{font-weight:500;font-size:15px;text-transform:none;letter-spacing:0;color:var(--paper)}
.apc .chip{min-width:0}
.apc .chip.flip{background:rgba(232,195,122,.12);border-color:var(--gold);border-style:solid}
.apc .badc{border-color:rgba(255,122,89,.5)}
.apc .badc.flip{background:rgba(255,122,89,.15);border-color:var(--ember)}
.apw{font-weight:500;font-size:15px;text-transform:none;letter-spacing:0;color:var(--paper)}
@container app (max-width:560px){.room{grid-template-columns:repeat(4,1fr)}}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px dashed rgba(239,233,223,.32);background:transparent;color:var(--paper);border-radius:10px;padding:9px 14px;font-size:15px;cursor:pointer;text-align:left;transition:background .2s,border-color .2s}
.chip:hover{border-color:rgba(239,233,223,.6)}
#close .voice p{font-size:clamp(19px,2cqw,27px);margin-bottom:.2em}
#recap .voice p{font-size:clamp(18px,1.7cqw,22px);margin-bottom:.15em}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:4px;gap:4px}
.seg button{border:0;background:transparent;color:var(--mute);font-size:15px;padding:7px 16px;border-radius:999px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--paper);color:var(--ink)}
.where small{white-space:nowrap}
details.srcs{font-size:13px;color:var(--mute);max-width:70ch}
details.srcs summary{cursor:pointer}
details.srcs ul{padding-left:18px;margin:10px 0 0;display:grid;gap:4px}
@container app (max-width:700px){.acts{grid-template-columns:1fr}}
.insight .try p{font-size:17px}

/* recap */
.recap{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.rc{border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:5px;background:rgba(34,31,41,.55)}
.rc time{font-size:12px;color:var(--gold);font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:.06em}
.rc b{font-family:var(--display);font-size:17px;line-height:1.2;font-weight:700}
.rc span{font-size:13px;color:var(--mute)}
.rc .mk{font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:600}
.rc .mk.y{color:var(--gold)}.rc .mk.n{color:var(--ember)}.rc .mk.s{color:var(--mute)}
h2.state{font-family:var(--display);font-weight:700;font-size:clamp(26px,3.4cqw,44px);line-height:1;letter-spacing:-.03em;margin:0;max-width:20ch;text-wrap:balance}
.sign{font-size:15px;color:var(--mute)}

nav{position:fixed;left:0;right:0;bottom:0;height:64px;z-index:20;display:flex;align-items:center;gap:16px;padding:0 clamp(16px,4cqw,40px);border-top:1px solid var(--line);background:rgba(23,21,28,.86);backdrop-filter:blur(8px)}
.where{display:flex;align-items:baseline;gap:10px;min-width:0;flex:1}
.where b{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.where small{color:var(--mute);font-variant-numeric:tabular-nums;font-size:13px}
.ticks{display:flex;gap:5px}
.ticks i{width:16px;height:3px;border-radius:3px;background:rgba(239,233,223,.14);transition:background .4s}
.ticks i.done{background:rgba(239,233,223,.45)}.ticks i.now{background:var(--gold)}
.navb{display:flex;gap:8px;flex:1;justify-content:flex-end}
.navb button{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:transparent;color:var(--paper);cursor:pointer;font-size:18px}
.navb button:hover{border-color:var(--paper)}
.navb button:disabled{opacity:.25;cursor:default}
#toast{position:fixed;top:22px;left:50%;transform:translate(-50%,-20px);z-index:50;background:var(--paper);color:var(--ink);padding:12px 22px;border-radius:999px;font-family:var(--voice);font-style:normal;font-size:20px;opacity:0;transition:opacity .5s,transform .5s;pointer-events:none;max-width:calc(100% - 32px);text-align:center}
#toast.in{opacity:1;transform:translate(-50%,0)}

@container app (max-width:960px){.grid2{grid-template-columns:1fr}.recap{grid-template-columns:repeat(2,1fr)}}
@container app (max-width:560px){
  .ln{grid-template-columns:1fr;gap:2px}.ln .who{text-align:left}
  .ticks{display:none}.recap{grid-template-columns:1fr}
  .tx.s3{font-size:26px}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div id="glow" aria-hidden="true"></div>
<div id="toast" role="status" aria-live="polite"></div>

<section class="scene" id="intro" aria-label="Start">
  <div class="wrap">
    <div class="kicker">A lesson on everyday communication</div>
    <h1 class="title">Did you<br><span>catch</span> that?</h1>
    <div class="voice md" id="v0" aria-live="polite"></div>
    <div class="acts reveal" id="day0"></div>
    <div class="row reveal" id="go0"><button class="btn solid" id="start">Start the week</button></div>
  </div>
</section>

<section class="scene" id="recap" aria-label="Your day, replayed">
  <div class="wrap wide">
    <div class="label">Your week, replayed</div>
    <h2 class="state reveal" id="rh">Small moments. None of them dramatic.</h2>
    <div class="voice sm" id="vr" aria-live="polite"></div>
    <div class="recap" id="rgrid"></div>
  </div>
</section>

<section class="scene" id="close" aria-label="Before you go">
  <div class="wrap">
    <div class="voice md" id="vc" aria-live="polite"></div>
    <div class="voice md" id="vc2" aria-live="polite"></div>
    <details class="srcs reveal" id="srcs"><summary>Where the research comes from</summary><ul id="srclist"></ul></details>
    <div class="row reveal" id="endc"><button class="btn" id="again">Start the week again</button><span class="sign">Did You Catch That?</span></div>
  </div>
</section>

<nav aria-label="Presentation">
  <div class="where"><b id="where">Start</b><small id="count"></small></div>
  <div class="ticks" id="ticks"></div>
  <div class="navb"><button id="prev" aria-label="Previous">&larr;</button><button id="next" aria-label="Next">&rarr;</button></div>
</nav>

<script>
(() => {
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
const APP = document.createElement('div'); APP.id = 'app';
[...document.body.children].forEach(el => { if (el.tagName !== 'SCRIPT') APP.appendChild(el); });
document.body.prepend(APP);
let Z = 1;
function fit() {
  const w = innerWidth, h = innerHeight;
  if (w < 620) Z = 1;                                  // phones: native stacked layout
  else if (h > w * 1.15) Z = Math.max(.75, w / 700);   // tablets held upright
  else Z = Math.max(.6, Math.min(w / 1280, h / 760));  // laptops, desktops, TVs
  APP.style.width = (w / Z) + 'px'; APP.style.height = (h / Z) + 'px';
  APP.style.transform = Z === 1 ? 'none' : `scale(${Z})`;
}
fit(); addEventListener('resize', fit);
const $ = (s, r = document) => r.querySelector(s);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const ABORT = Symbol('abort');
let token = 0, cur = 0, rush = false, busy = 0;
const caret = document.createElement('span'); caret.className = 'caret';
const NL = { nl: 1 };
const stats = { start: Date.now(), away: 0, ans: [] };
const show = el => el.classList.add('in');

const chk = tk => { if (tk !== token) throw ABORT; };
const W = async (ms, tk) => { if (!RM && !rush) await sleep(ms); chk(tk); };
async function typeText(el, text, tk, sp = 1) {
  const tn = document.createTextNode(''); el.append(tn, caret);
  for (const ch of text) {
    chk(tk); tn.data += ch;
    if (RM || rush) continue;
    let d = (20 + Math.random() * 30) * sp;
    if (',;'.includes(ch)) d += 150; else if ('.?!…—'.includes(ch)) d += 210;
    await sleep(d);
  }
  chk(tk);
}
async function say(el, ops, tk, append = false) {
  if (!append) el.innerHTML = '';
  let p = document.createElement('p'); el.appendChild(p);
  if (!RM && !rush) { const d = document.createElement('span'); d.className = 'dots'; d.innerHTML = '<i></i><i></i><i></i>'; p.appendChild(d); await sleep(480 + Math.random() * 360); d.remove(); chk(tk); }
  for (const op of ops) {
    chk(tk);
    if (typeof op === 'number') { await W(op, tk); continue; }
    if (op.nl) { p = document.createElement('p'); el.appendChild(p); continue; }
    if (op.cls) { p.classList.add(op.cls); continue; }
    await typeText(p, op, tk);
  }
}
function run(tk, fn) {
  busy = tk;
  return Promise.resolve().then(() => fn(tk)).catch(e => { if (e !== ABORT) console.error(e); })
    .finally(() => { if (busy === tk) { busy = 0; rush = false; } });
}

/* attention light */
const glow = $('#glow'); const G = { x: innerWidth / 2 / Z, y: innerHeight / 2 / Z, tx: innerWidth / 2 / Z, ty: innerHeight / 2 / Z };
addEventListener('pointermove', e => { G.tx = e.clientX / Z; G.ty = e.clientY / Z; }, { passive: true });
(function lg() { const k = RM ? 1 : .14; G.x += (G.tx - G.x) * k; G.y += (G.ty - G.y) * k; glow.style.transform = `translate(${G.x}px,${G.y}px)`; requestAnimationFrame(lg); })();
/* grain */
(() => { const c = document.createElement('canvas'), s = 160; c.width = c.height = s; const x = c.getContext('2d'), d = x.createImageData(s, s);
  for (let i = 0; i < d.data.length; i += 4) { const v = Math.random() * 255; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 255; }
  x.putImageData(d, 0, 0); const g = document.createElement('div'); g.id = 'grain'; g.setAttribute('aria-hidden', 'true'); g.style.backgroundImage = `url(${c.toDataURL()})`; document.body.appendChild(g); })();
/* the page notices when you leave */
const toastEl = $('#toast'); let tt, hiddenAt = null;
function toast(m) { toastEl.textContent = m; show(toastEl); clearTimeout(tt); tt = setTimeout(() => toastEl.classList.remove('in'), 4200); }
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { hiddenAt = Date.now(); return; }
  if (!hiddenAt) return; const s = Math.round((Date.now() - hiddenAt) / 1000); hiddenAt = null; if (s < 2) return;
  stats.away++; toast(stats.away === 1 ? `You were gone for ${s} seconds. I noticed. People do too.` : `Away again. ${s} seconds this time.`);
});

/* ---------- the eight moments ---------- */
const ACTS = ['Your noise', 'Their turn', 'Your words'];
const M = [
/* ---------- ACT 1: YOUR NOISE ---------- */
{ act: 0, time: 'Mon · 7:48 AM', place: 'Train, northbound', title: 'The phone call', meter: true,
  async play(st, tk) {
    st.meter(15);
    await st.line('Marco · on a call', "Hello? Yeah, I'm on the train.", tk, { tcls: 's1' }); st.meter(40); await W(500, tk);
    await st.line('Marco · on a call', "NO, tell him the loan didn't go through.", tk, { tcls: 's2' }); st.meter(68); await W(400, tk);
    await st.line('Woman by the door', 'I did not need to know that.', tk, { th: 1 }); await W(300, tk);
    await st.line('Marco · on a call', "BECAUSE MY CARD IS MAXED OUT, THAT'S WHY!", tk, { tcls: 's3' }); st.meter(96); await W(400, tk);
    await st.line('Student', "can't focus on her reviewer anymore", tk, { th: 1 }); await W(400, tk);
    await st.line('Marco · on a call', 'Okay, okay. Bye. Love you.', tk, { tcls: 's1' }); st.meter(25);
  },
  q: ["Marco shouldn't take calls on the train at all.", 'The whole carriage got pulled into a call nobody joined, and he had no idea.', "Nothing. It's a public place, people make calls."], a: 1,
  lands: 'Everyone nearby lost their focus, and Marco gave away private details without meaning to.',
  why: "Hearing half a phone call is harder to ignore than a full conversation, because your brain can't predict what comes next.",
  src: 'Emberson et al., Psychological Science, 2010',
  instead: '“I’ll call you back when I’m off the train.” Or keep it short and low.',
  rule: 'Your voice travels further than you think.' },

{ act: 0, time: 'Mon · 12:10 PM', place: 'Office pantry', title: 'Lunch noise', meter: true,
  async play(st, tk) {
    await st.line('Ben', 'Mm. Did you watch the game last night?', tk);
    st.sfx('crunch', 62, 6, 22, -6); st.meter(35); await W(500, tk);
    st.sfx('CRUNCH', 14, 36, 34, 4); st.meter(55); await W(400, tk);
    await st.line('Ben', '(mouth full) Grabe, it was so close!', tk);
    st.sfx('smack', 70, 44, 26, 8); st.meter(72); await W(350, tk);
    st.sfx('CRUNCH', 40, 70, 40, -3); st.meter(90); await W(500, tk);
    await st.line('Kat', 'I can hear every single bite from here.', tk, { th: 1 }); await W(700, tk);
    await st.line('Kat', "Ah, I think I'll eat at my desk today.", tk); await W(300, tk);
    await st.line('Ben', 'Oh, okay!', tk); st.sfx('crunch', 78, 82, 20, -8);
  },
  q: ['The chewing was pushing Kat away, and Ben had no idea.', 'Kat was being a little antisocial.', "Ben shouldn't bring chips to the office."], a: 0,
  lands: 'Nobody says anything. People just quietly change where they sit, and who they eat with.',
  why: 'Loud chewing topped the list of sounds people found disgusting, and about 1 in 5 adults in the UK react strongly to sounds like it.',
  src: 'Vitoratou et al., PLOS ONE, 2023',
  instead: 'Mouth closed while chewing. Swallow before you talk.',
  rule: 'Chew closed. Swallow, then talk.' },

{ act: 0, time: 'Tue · 3:20 PM', place: 'Clinic waiting area', title: 'Speaker on', meter: true,
  async play(st, tk) {
    await st.line('Guy in row 2', 'scrolling videos, speaker on, full volume', tk, { th: 1 });
    const S = [['[video] HAHAHA BRO NO WAY', 8, 8, 24, -4, 40], ['♪ ♪ trending song ♪ ♪', 52, 22, 22, 5, 55], ['WAIT FOR IT… WAIT FOR IT', 18, 46, 28, -2, 72], ['[video] HAHAHAHA', 60, 58, 30, 6, 88], ['ding ding ding', 30, 78, 22, -7, 95]];
    for (const [t, x, y, sz, r, mv] of S) { st.sfx(t, x, y, sz, r); st.meter(mv); await W(420, tk); }
    await st.line('Nurse', 'Mrs. Santos? …Mrs. Santos?', tk, { cls: 'quiet' }); await W(600, tk);
    await st.line('Mrs. Santos, 74', 'Did they call me already?', tk, { th: 1 }); await W(400, tk);
    await st.line('Nurse', 'Okay, next. Mr. Reyes.', tk, { cls: 'quiet' });
  },
  q: ['The nurse should have called louder.', "He was bored. It's a long wait.", 'His videos drowned out the room, and an elderly patient missed her name.'], a: 2,
  lands: 'One phone set the volume for the whole room. Mrs. Santos waits another hour.',
  why: "To the person holding the phone it's background noise. To everyone else, it's the loudest thing in the room.",
  src: '',
  instead: 'Earphones, or mute it and turn on captions.',
  rule: 'Shared space, shared volume.' },

/* ---------- ACT 2: THEIR TURN ---------- */
{ act: 1, time: 'Wed · 9:30 AM', place: 'Team meeting', title: 'The interruption',
  async play(st, tk) {
    const ana = await st.line('Ana', 'I think the campaign underperformed because we launched before the—', tk);
    st.shove(ana);
    await st.line('Jules', "Yeah, yeah, the timing was off. Anyway, next quarter let's just go bigger.", tk, { sp: .7 }); await W(600, tk);
    await st.line('Manager', "Good point, Jules. Let's do that.", tk); await W(700, tk);
    await st.line('Ana', "That's not what I was going to say.", tk, { th: 1 });
  },
  q: ['Ana took too long to get to her point.', 'Jules made a good point, and the meeting moved on.', 'Ana got cut off, and her real point never made it into the room.'], a: 2,
  lands: 'Jules got credit for half of Ana’s sentence. Ana will say less next meeting.',
  why: 'People who keep getting cut off start squeezing their ideas into polished sound bites instead of thinking out loud.',
  src: 'Workplace interruption study, Harvard Business Review, 2026',
  instead: 'Let the sentence land. If you jumped in, hand it back: “Sorry, go on.”',
  rule: 'Let the sentence finish.' },

{ act: 1, time: 'Wed · 12:35 PM', place: 'Lunch with a friend', title: 'The story swap',
  async play(st, tk) {
    const m = await st.line('Mia', "My dad's back in the hospital. I've been going every night after work, and I'm just… tired.", tk); st.spot(m); await W(800, tk);
    const j = await st.line('Jo', "Oh my gosh, same! When my tita was confined last year, I literally didn't sleep for two weeks.", tk, { sp: .75 });
    st.spot(j); m.classList.add('dim');
    await st.line('Jo', "And the billing? Don't get me started. They charged us for everything, even the—", tk, { sp: .75 }); await W(700, tk);
    const m2 = await st.line('Mia', 'Yeah… that sounds really hard.', tk); m2.classList.add('dim'); await W(600, tk);
    await st.line('Mia', "So now I'm the one comforting her.", tk, { th: 1 });
  },
  q: ['Jo was relating, which is a kind of support.', 'Mia opened up, and Jo turned it into her own story.', 'Mia should have talked to her family instead.'], a: 1,
  lands: 'Mia learned that telling Jo something means hearing about Jo.',
  why: 'Sociologist Charles Derber calls this a “shift response”: it moves attention from the speaker to you. A “support response” asks them to tell you more.',
  src: 'Charles Derber, The Pursuit of Attention',
  instead: '“How’s he doing? And how are you holding up?” Your story can wait.',
  rule: 'Keep the spotlight on the one who opened up.' },

{ act: 1, time: 'Thu · 6:40 PM', place: 'Convenience store', title: 'The cashier',
  async play(st, tk) {
    const c1 = await st.line('Cashier', 'Good evening po! Do you have a member card?', tk);
    await st.line('Customer · on a call', "Yeah, I'm at the store. What do you want?", tk, { cls: 'phone' }); st.ignored(c1); await W(500, tk);
    const c2 = await st.line('Cashier', '₱248 po, sir.', tk);
    await st.line('Customer · on a call', 'drops the money on the counter without looking up', tk, { th: 1, cls: 'phone' }); st.ignored(c2); await W(500, tk);
    const c3 = await st.line('Cashier', 'Thank you po! Ingat!', tk); await W(900, tk); st.ignored(c3); await W(600, tk);
    await st.line('Cashier', 'Third one like that this hour.', tk, { th: 1 });
  },
  q: ['The cashier spoke to him three times and got nothing back.', 'He was busy. Nothing wrong with that.', 'The cashier was being too chatty.'], a: 0,
  lands: 'He wasn’t loud or mean. He just treated a person like a vending machine.',
  why: 'Customers who smiled and chatted briefly with the barista left in a better mood than those who kept it quick. A small hello helps both people.',
  src: 'Sandstrom & Dunn, Social Psychological and Personality Science, 2014',
  instead: 'Pause the call for five seconds. Look up. “Thanks po, ingat din.”',
  rule: 'See the people serving you.' },

{ act: 1, time: 'Thu · 8:15 PM', place: 'Family dinner', title: 'Half there',
  async play(st, tk) {
    await st.line('Lola', 'When your Lolo and I first met, he was selling pandesal outside the church.', tk);
    await st.line('Paolo', 'Mm-hmm.', tk, { cls: 'phone' }); st.blue();
    await W(400, tk);
    await st.line('Lola', 'Every Sunday he gave me one for free. For a whole year.', tk, { cls: 'quiet' });
    await st.line('Paolo', 'Haha, nice.', tk, { cls: 'phone' }); await W(1100, tk);
    await st.line('Lola', '…You’ve heard this one already, ano?', tk, { cls: 'quieter' }); await W(900, tk);
    await st.line('Paolo', 'Huh? Sorry, La, what was that?', tk, { cls: 'phone' });
  },
  q: ['Lola tells the same stories a lot.', 'Nothing. Paolo was answering her.', 'Paolo was at the table but not listening, and Lola could tell.'], a: 2,
  lands: 'Lola cut her story short. Next time, she might not tell it at all.',
  why: 'When a phone was just sitting in view, people rated the conversation as less close and their partner as less understanding.',
  src: 'Misra et al., “The iPhone Effect,” Environment and Behavior, 2014',
  instead: 'Phone face-down. Need a second? “Wait lang, La.” Then put it away.',
  rule: 'Be where you are.' },

/* ---------- ACT 3: YOUR WORDS ---------- */
{ act: 2, time: 'Sat · 2:00 PM', place: 'Family reunion', title: 'The greeting',
  async play(st, tk) {
    await st.line('Tita Baby', 'Ay, Bea! Tumaba ka, ah!', tk, { tcls: 's1' }); await W(400, tk);
    await st.line('Bea', 'Hi, Tita… okay naman po.', tk, { cls: 'quiet' }); await W(400, tk);
    await st.line('Tito Ramon', 'Kaya pala! Masarap siguro ulam sa Manila. Joke lang!', tk);
    st.sfx('HAHAHA', 58, 30, 30, -4); await W(250, tk); st.sfx('hahaha', 20, 52, 22, 6); await W(700, tk);
    await st.line('Bea', "Third person today who said that before “hello.”", tk, { th: 1 }); await W(700, tk);
    await st.line('Bea', 'puts the second serving back', tk, { th: 1 });
  },
  q: ["It's just how Titas say hello. Nobody meant harm.", 'Bea should laugh along. It was a joke.', '“You gained weight” was the first thing she heard, again, and it landed harder than anyone meant.'], a: 2,
  lands: 'Bea smiles, eats less, and quietly plans to skip the next reunion.',
  why: 'In a 2025 nationwide survey, 52% of Filipinos aged 18 to 24 said body image was hurting their mental health.',
  src: 'Arkipelago Analytics survey, as reported by the Inquirer and Manila Bulletin, 2025',
  instead: 'Start with anything else. “Bea! I missed you. How’s work?”',
  rule: 'Greet the person, not the body.' },

{ act: 2, time: 'Sat · 4:30 PM', place: 'Barkada group chat', title: 'Too much heat', chat: true,
  async play(st, tk) {
    st.chatHead('Outing GC', '5 members');
    await st.bub('them', "Guys, I forgot to book the resort. It's fully booked now. Sorry.", tk, 'Carlo'); await W(900, tk);
    await st.bub('me', 'ARE YOU SERIOUS??? We reminded you FIVE TIMES.', tk, 'Jo', 'hot'); await W(250, tk);
    await st.bub('me', 'This is SO typical of you. Never mind, I’ll do everything myself like always.', tk, 'Jo', 'hot');
    await W(900, tk);
    st.typing(true); await W(1400, tk); st.typing(false); await W(700, tk);
    st.note('Nobody replied for 40 minutes.');
  },
  q: ['Carlo deserved it. He was reminded five times.', 'Jo had a fair point, but the way she said it turned a booking problem into a fight.', 'Group chats are a bad place to plan anything.'], a: 1,
  lands: 'Carlo goes quiet. Everyone else is too awkward to suggest a fix.',
  why: 'Readers guess the tone of a text right only about as often as a coin flip, and senders are sure they came across fine.',
  src: 'Kruger, Epley et al., Journal of Personality and Social Psychology, 2005',
  instead: '“Ugh, that’s frustrating. Can we check two other resorts tonight?”',
  rule: 'Too much emotion buries the point.' },

{ act: 2, time: 'Sat · 11:02 PM', place: 'Late-night chat', title: 'Too much logic', chat: true,
  async play(st, tk) {
    st.chatHead('Mia', 'Jo');
    await st.bub('them', 'He broke up with me. Over text. After three years.', tk); await W(500, tk);
    await st.bub('them', "I can't stop crying.", tk); await W(1000, tk);
    await st.bub('me', 'Honestly, the signs were there. He stopped posting you months ago.', tk); await W(300, tk);
    await st.bub('me', 'Better now than after the wedding. Block him and focus on yourself.', tk, '', 'cold');
    st.meta('Seen 11:04 PM'); await W(700, tk);
    for (let i = 0; i < 2; i++) { st.typing(true); await W(1300, tk); st.typing(false); await W(900, tk); }
    st.note('Mia stopped typing.');
  },
  q: ["Jo was being honest. That's what friends are for.", 'Mia needed comfort, and she got an analysis.', 'Mia should have called instead of texting.'], a: 1,
  lands: 'Mia stops typing. Next time something happens, she’ll tell someone else first.',
  why: 'When people were upset, they found “that sounds really hard” more comforting than being told to see things differently.',
  src: 'Sahi et al., UCLA, 2022, via The New York Times',
  instead: '“I’m so sorry. That’s awful. Want me to call?” The advice can wait.',
  rule: 'Too much logic misses the person.' },

{ act: 2, time: 'Sun · 10:15 AM', place: 'The next morning', title: 'The sorry', chat: true,
  async play(st, tk) {
    st.chatHead('Mia', 'Jo');
    await st.bub('me', 'Hey. Sorry if what I said last night upset you.', tk); await W(400, tk);
    await st.bub('me', 'I was just being honest. You know me naman.', tk); await W(1200, tk);
    await st.bub('them', 'Okay.', tk);
    st.meta('Seen 10:21 AM'); await W(900, tk);
    st.note('Mia read it as: so it’s my fault I got hurt.');
  },
  q: ['Jo apologized. That should settle it.', 'Jo said sorry but took no responsibility, so it felt like blame.', 'Mia is overreacting to a simple message.'], a: 1,
  lands: 'Mia hears “you’re too sensitive,” wrapped in the word sorry.',
  why: 'In a study of six parts of an apology, taking responsibility mattered most. “Sorry if you felt that way” skips it.',
  src: 'Lewicki, Polin & Lount, Negotiation and Conflict Management Research, 2016',
  instead: '“I’m sorry I lectured you when you needed comfort. That wasn’t fair.”',
  rule: 'Own it. No “if,” no “but.”' }
];

/* ---------- theory slides: the idea behind the moments ---------- */
const T = [
{ after: 0, name: 'The halfalogue', origin: 'Emberson et al., Cornell, 2010',
  plain: 'Hearing one side of a phone call is more distracting than hearing two people talk. Your brain keeps guessing the missing half and can’t switch off. People in the study did worse on attention tasks while overhearing half a call.',
  widget: 'half', src: 'Emberson, Lupyan, Goldstein & Spivey, Psychological Science, 2010',
  next: 'So it wasn’t nosiness. The whole carriage was forced to listen.' },
{ after: 1, name: 'Habituation', origin: 'Neuroscience of attention',

function makeTheoryScene(t, k) {

  $('.label', s).textContent = `Why it happens · ${M[t.after].title}`;
  $('.t-origin', s).textContent = t.origin; $('.t-name', s).textContent = t.name; $('.t-plain', s).textContent = t.plain; $('.t-src', s).textContent = 'Source: ' + t.src;
  const wg = buildWidget(t.widget, $('.whost', s));
  return { el: s, scene: {

      for (const c of s.querySelectorAll('.tl .reveal')) { show(c); await W(350, tk); }

    note(t) { const m = document.createElement('div'); m.className = 'note'; m.textContent = t; lines.appendChild(m); },
    typing(on) { if (on) { typ = document.createElement('div'); typ.className = 'typ'; typ.innerHTML = '<span class="dots"><i></i><i></i><i></i></span>'; lines.appendChild(typ); } else if (typ) { typ.remove(); typ = null; } },
    sfx(t, x, y, sz, r) { const s = document.createElement('span'); s.className = 'sfx'; s.textContent = t; s.style.left = x + '%'; s.style.top = y + '%'; s.style.fontSize = sz + 'px'; s.style.setProperty('--r', r + 'deg'); noise.appendChild(s); requestAnimationFrame(() => requestAnimationFrame(() => s.classList.add('in'))); },
    meter(p) { if (mb) mb.style.width = p + '%'; },
    spot(row) { spot.style.opacity = 1; spot.style.top = (lines.offsetTop + row.offsetTop + row.offsetHeight / 2 - 75) + 'px'; },
    shove(row) { row.classList.add('shoved'); },
    ignored(row) { row.classList.add('ignored'); const t = document.createElement('span'); t.className = 'tag'; t.textContent = 'no reply'; $('.tx', row).appendChild(t); },
    blue() { root.classList.add('blue'); }
  };
}

/* build the moment scenes */
const recapEl = $('#recap');
const momentScenes = M.map((m, i) => {
  const s = document.createElement('section'); s.className = 'scene'; s.setAttribute('aria-label', m.title);
  s.innerHTML = `<div class="wrap wide">
    <div class="label"></div>
    <div class="grid2">
      <div class="stage${m.chat ? ' chat' : ''}">
        <div class="stage-h"><span><time></time><span class="pl"></span></span><span class="hr">${m.meter ? '<span class="db">Volume nearby <i><b></b></i></span>' : ''}<button class="replay">Replay</button></span></div>
        <div class="spot"></div><div class="lines"></div><div class="noise"></div>
      </div>
      <div class="side">
        <div class="ask reveal"><div class="q">What did you notice?</div><div class="opts"></div></div>
        <div class="voice sm fb" aria-live="polite"></div>
        <div class="insight reveal">
          <div><h4>How it lands</h4><p class="lands"></p></div>
          <div><h4>Why nobody notices</h4><p class="why"></p><p class="src"></p></div>
          <div class="try"><h4>Try instead</h4><p class="instead"></p></div>
        </div>
      </div>
    </div></div>`;
  $('.label', s).textContent = `Act ${m.act + 1}, ${ACTS[m.act]} · ${i + 1} of ${M.length}`;
  $('time', s).textContent = m.time; $('.pl', s).textContent = m.place;
  $('.why', s).textContent = m.why; $('.src', s).textContent = m.src ? 'Source: ' + m.src : ''; $('.lands', s).textContent = m.lands; $('.instead', s).textContent = m.instead;
  return s;
});
const theoryBuilt = T.map((t, k) => makeTheoryScene(t, k));
const ORDER = [];
M.forEach((m, i) => { ORDER.push({ m: i }); T.forEach((t, k) => { if (t.after === i) ORDER.push({ t: k }); }); });
ORDER.forEach(o => recapEl.before(o.m !== undefined ? momentScenes[o.m] : theoryBuilt[o.t].el));
const scenes = [...document.querySelectorAll('.scene')];
const NAMES = ['Start', ...ORDER.map(o => o.m !== undefined ? M[o.m].time + ' · ' + M[o.m].title : 'Why · ' + T[o.t].name), 'Your week, replayed', 'Before you go'];

const RIGHT = [['You caught it.'], ['Good eye.', 500, ' That one slips past a lot of people.'], ['That’s the one.'], ['Yes.', 400, ' Exactly that.']];
const WRONG = [['That’s what most of us would see.', 500, NL, 'Look a little closer.'], ['That’s the easy reading.', 500, NL, 'There’s something underneath it.'], ['Close, but there’s more going on.']];

function momentScene(i) {
  const m = M[i], s = momentScenes[i], st = stageAPI($('.stage', s));
  const opts = $('.opts', s), fb = $('.fb', s), ins = $('.insight', s), ask = $('.ask', s);
  async function playIt(tk) { st.reset(); await W(500, tk); await m.play(st, tk); }
  $('.replay', s).addEventListener('click', () => { const tk = ++token; run(tk, playIt); });
  return {
    async enter(tk) {
      opts.innerHTML = ''; fb.innerHTML = '';
      m.q.forEach((q, qi) => {
        const b = document.createElement('button'); b.className = 'opt'; b.textContent = q;
        b.addEventListener('click', () => {
          if (stats.ans[i] === undefined) stats.ans[i] = qi === m.a;
          [...opts.children].forEach((o, oi) => { o.disabled = true; if (oi === m.a) o.classList.add('right'); else if (oi === qi) o.classList.add('wrong'); else o.classList.add('fade'); });
          const pool = qi === m.a ? RIGHT : WRONG;
          run(token, async t => {
            await say(fb, pool[i % pool.length], t);
            await W(400, t); show(ins);
            ins.scrollIntoView({ behavior: RM ? 'auto' : 'smooth', block: 'nearest' });
          });
        });
        opts.appendChild(b);
      });
      await playIt(tk);
      await W(600, tk); show(ask);
    }
  };
}

const S = [];
S[0] = { async enter(tk) {
  const dl = $('#day0'); dl.innerHTML = '';
  const blurbs = ['Phone calls, chewing, speakers. The sound we forget other people can hear.', 'Interrupting, story swapping, half-listening, ignoring the person in front of us.', 'Greetings, group chats, comfort, and apologies. Too much heat, too much logic.'];
  ACTS.forEach((a, k) => { const d = document.createElement('div'); d.innerHTML = '<small></small><b></b><span></span>'; d.children[0].textContent = 'Act ' + (k + 1) + ' · ' + M.filter(m => m.act === k).length + ' moments'; d.children[1].textContent = a; d.children[2].textContent = blurbs[k]; dl.appendChild(d); });
  await W(600, tk);
  await say($('#v0'), ['Hi.', 600, NL, `Here are ${M.length} small moments from one ordinary week.`, 600, NL, 'Nothing dramatic happens in any of them.', 700, NL, "That's exactly why nobody notices. See if you can.", 600, NL, { cls: 'aside' }, 'After each one, a short idea that explains why it happens.'], tk);
  await W(300, tk); show(dl); await W(300, tk); show($('#go0'));
}};
$('#start').addEventListener('click', () => go(1));
ORDER.forEach((o, j) => S[j + 1] = o.m !== undefined ? momentScene(o.m) : theoryBuilt[o.t].scene);
const LAST = ORDER.length;

S[LAST + 1] = { async enter(tk) {
  const g = $('#rgrid'); g.innerHTML = '';
  show($('#rh'));
  await say($('#vr'), ['None of these people were bad.', 500, NL, "That's what makes them so easy to miss.", 600, NL, 'Most of us have been every one of them at some point this week.'], tk);
  for (const [i, m] of M.entries()) {
    const c = document.createElement('div'); c.className = 'rc reveal';
    const a = stats.ans[i];
    c.innerHTML = '<time></time><b></b><span></span><div class="mk"></div>';
    c.children[0].textContent = 'Act ' + (m.act + 1) + ' · ' + m.time; c.children[1].textContent = m.rule; c.children[2].textContent = m.title;
    const mk = c.children[3]; mk.textContent = a === true ? 'You spotted it' : a === false ? 'Missed it' : 'Skipped'; mk.classList.add(a === true ? 'y' : a === false ? 'n' : 's');
    g.appendChild(c); await W(160, tk); show(c);
  }
}};

S[LAST + 2] = { async enter(tk) {
  $('#vc2').innerHTML = '';
  const got = stats.ans.filter(x => x === true).length, tried = stats.ans.filter(x => x !== undefined).length;
  const min = Math.max(1, Math.round((Date.now() - stats.start) / 60000));
  const ops = [];
  if (tried) ops.push(`You spotted ${got} of ${tried}.`, 600, NL, { cls: 'aside' },
    got === tried ? "You didn't miss one. The hard part is catching yourself." : got === 0 ? "That's alright. That's what makes this stuff invisible." : 'The ones you missed are probably the ones you do.', 900, NL);
  ops.push(`We spent ${min} minute${min > 1 ? 's' : ''} on one pretend week.`, 600, NL, 'You’ll have a real one starting tomorrow, with most of these moments in it.', 800);
  if (stats.away) ops.push(NL, { cls: 'aside' }, `You stepped away ${stats.away === 1 ? 'once' : stats.away + ' times'} while I was talking. I noticed. People always do.`, 700);
  await say($('#vc'), ops, tk);
  await W(1100, tk);
  await say($('#vc2'), ['Lower your voice.', 400, ' Let them finish.', 400, NL, 'Stay on their story.', 400, ' Look up.', 600, NL, 'Feel it, but don’t aim it.', 400, ' Comfort first, facts later.', 600, NL, 'Basic things. That’s why they matter.', 1000, NL, { cls: 'aside' }, 'Thanks for paying attention. It’s rarer than it should be.'], tk);
  const ul = $('#srclist'); ul.innerHTML = ''; M.filter(m => m.src).forEach(m => { const li = document.createElement('li'); li.textContent = m.title + ': ' + m.src; ul.appendChild(li); }); T.forEach(t => { const li = document.createElement('li'); li.textContent = t.name + ': ' + t.src; ul.appendChild(li); });
  show($('#srcs')); show($('#endc'));
}};
$('#again').addEventListener('click', () => { stats.ans = []; stats.away = 0; stats.start = Date.now(); go(0); });

/* navigation */
const ticks = $('#ticks'); scenes.forEach(() => ticks.appendChild(document.createElement('i')));
function go(i) {
  if (i < 0 || i >= scenes.length) return;
  S[cur] && S[cur].leave && S[cur].leave();
  scenes[cur].classList.remove('on');
  cur = i; const tk = ++token; rush = false;
  const sc = scenes[i]; sc.classList.add('on'); sc.scrollTop = 0;
  sc.querySelectorAll('.reveal').forEach(e => e.classList.remove('in'));
  sc.querySelectorAll('.voice').forEach(v => v.innerHTML = '');
  $('#where').textContent = NAMES[i];
  $('#count').textContent = String(i + 1).padStart(2, '0') + ' / ' + String(scenes.length).padStart(2, '0');
  [...ticks.children].forEach((t, j) => t.className = j < i ? 'done' : j === i ? 'now' : '');
  $('#prev').disabled = i === 0; $('#next').disabled = i === scenes.length - 1;
  run(tk, S[i].enter);
}
function next() { if (busy === token) { rush = true; return; } go(cur + 1); }
$('#next').addEventListener('click', next);
$('#prev').addEventListener('click', () => go(cur - 1));
addEventListener('keydown', e => {
  const tg = e.target;
  if (['ArrowRight', 'PageDown'].includes(e.key) || (e.key === ' ' && !(tg && tg.tagName === 'BUTTON'))) { e.preventDefault(); next(); }
  else if (['ArrowLeft', 'PageUp'].includes(e.key)) { e.preventDefault(); go(cur - 1); }
});
go(0);
})();
</script>
</body>
</html>
